<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Contraseña</title>
<link rel="stylesheet" href="CSS/VerSalon.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


</head>
<body>

  <div class="card new-password-card p-4">
    <div class="card-body">
      <h3 class="text-center mb-3">Nueva Contraseña</h3>
      <p class="text-center text-muted mb-4">
        Ingresá tu nueva contraseña dos veces para confirmarla.
      </p>

      <form id="newPasswordForm">
        <!-- Nueva contraseña -->
        <div class="mb-3">
          <label for="newPassword" class="form-label">Nueva contraseña</label>
          <input type="password" class="form-control" id="newPassword" placeholder="••••••••" required>
        </div>

        <!-- Confirmar nueva contraseña -->
        <div class="mb-3">
          <label for="confirmNewPassword" class="form-label">Confirmar nueva contraseña</label>
          <input type="password" class="form-control" id="confirmNewPassword" placeholder="••••••••" required>
          <div id="errorMessage" class="error-message mt-1">Las contraseñas no coinciden</div>
        </div>

        <!-- Botón -->
        <button type="submit" class="btn btn-esmeralda w-100 mb-3">Guardar nueva contraseña</button>

        <hr class="my-3">

        <div class="text-center">
          <a href="Iniciosesion.html" class="text-decoration-none">← Volver a Iniciar Sesión</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
