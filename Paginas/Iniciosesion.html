<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="../CSS/VerSalon.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f0f2f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body class="b1">

  <div class="card login-card p-4">
    <div class="card-body">
      <h3 class="text-center mb-4">Iniciar Sesión</h3>
      <div id="alertaLogin" class="alert d-none" role="alert"></div>

      <form id="loginForm">
        <!-- Correo -->
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="tu@correo.com" required>
        </div>

        <!-- Contraseña -->
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
        </div>

        <!-- Recordarme -->
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="recordarme" name="recordarme">
          <label class="form-check-label" for="recordarme">Recordarme</label>
        </div>

        <!-- Botón -->
        <button type="submit" class="btn btn-esmeralda w-100 mb-3">Iniciar Sesión</button>

        <!-- Enlaces -->
        <div class="text-center">
          <a href="olviContrsea.html" class="text-decoration-none">¿Olvidaste tu contraseña?</a>
        </div>

        <hr class="my-3">

        <div class="text-center">
          <span>¿No tienes cuenta?</span>
          <a href="Registrar.html" class="text-decoration-none fw-bold" style="color: #50C878;">Regístrate</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const alerta = document.getElementById('alertaLogin');
      const formData = new FormData(this);
      formData.append('accion', 'login');

      try {
        const response = await fetch('../php/api/auth.php', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();

        if (data.exito) {
          alerta.className = 'alert alert-success';
          alerta.textContent = '¡Bienvenido! Iniciando sesión...';
          alerta.classList.remove('d-none');
          setTimeout(() => {
            window.location.href = 'VerSalones.html';
          }, 1200);
        } else {
          alerta.className = 'alert alert-danger';
          alerta.textContent = data.mensaje || 'Credenciales inválidas.';
          alerta.classList.remove('d-none');
        }
      } catch (err) {
        alerta.className = 'alert alert-warning';
        alerta.textContent = 'Servidor local no disponible o error de red. Para interactuar con la base de datos MySQL, inicie su servidor local (XAMPP).';
        alerta.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
