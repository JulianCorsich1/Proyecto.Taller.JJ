<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña</title>
 <link rel="stylesheet" href="CSS/VerSalon.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
   
  </style>
</head>
<body class="b1">

  <div class="card recover-card p-4">
    <div class="card-body">
      <h3 class="text-center mb-3">Recuperar Contraseña</h3>
      <p class="text-center text-muted mb-4">
        Ingresá tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.
      </p>

      <form>
        <!-- Correo -->
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" placeholder="tu@correo.com" required>
        </div>

        <!-- Botón -->
        <button type="submit" class="btn btn-esmeralda w-100 mb-3">Enviar enlace</button>

        <hr class="my-3">

        <div class="text-center">
          <a href="Iniciosesion.html" class="text-decoration-none">← Volver a Iniciar Sesión</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
