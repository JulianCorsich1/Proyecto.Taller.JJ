<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro</title>
    <link rel="stylesheet" href="../CSS/VerSalon.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  
</head>
<body class="b1">

  <div class="card register-card p-4">
    <div class="card-body">
      <h3 class="text-center mb-4">Crear Cuenta</h3>
      <div id="alertaRegistro" class="alert d-none" role="alert"></div>

      <form id="registroForm">
        <!-- Nombre completo -->
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre completo</label>
          <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Tu nombre" required>
        </div>

        <!-- Correo -->
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" id="email" name="email" placeholder="tu@correo.com" required>
        </div>

        <!-- Contraseña -->
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
        </div>

        <!-- Confirmar contraseña -->
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
          <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
        </div>

        <!-- Términos y condiciones -->
        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" id="terminos" required>
          <label class="form-check-label" for="terminos">
            Acepto los <a href="#">términos y condiciones</a>
          </label>
        </div>

        <!-- Botón -->
        <button type="submit" id="btnSubmit" class="btn btn-esmeralda w-100 mb-3">Registrarse</button>

        <hr class="my-3">

        <div class="text-center">
          <span>¿Ya tienes una cuenta?</span>
          <a href="Iniciosesion.html" class="fw-bold text-decoration-none">Iniciar Sesión</a>
        </div>
      </form>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    document.getElementById('registroForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const alerta = document.getElementById('alertaRegistro');
      const pass = document.getElementById('password').value;
      const confirmPass = document.getElementById('confirmPassword').value;

      if (pass !== confirmPass) {
        alerta.className = 'alert alert-danger';
        alerta.textContent = 'Las contraseñas no coinciden.';
        alerta.classList.remove('d-none');
        return;
      }

      const formData = new FormData(this);
      formData.append('accion', 'registro');

      try {
        const response = await fetch('../php/api/auth.php', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();

        if (data.exito) {
          alerta.className = 'alert alert-success';
          alerta.textContent = data.mensaje;
          alerta.classList.remove('d-none');
          setTimeout(() => {
            window.location.href = 'VerSalones.html';
          }, 1500);
        } else {
          alerta.className = 'alert alert-danger';
          alerta.textContent = data.mensaje || 'Error al procesar el registro.';
          alerta.classList.remove('d-none');
        }
      } catch (err) {
        alerta.className = 'alert alert-warning';
        alerta.textContent = 'Servidor local no disponible o error de red. Para interactuar con la base de datos MySQL, inicie su servidor local (XAMPP).';
        alerta.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
