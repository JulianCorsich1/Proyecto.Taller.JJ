<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>MiSalonOnlin</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
        <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="CSS/VerSalon.css">
    </head>
    <body>
        <nav class="navbar">
            <div class="nav-brand">MiSalónOnline</div>
                <div class="nav-links">
                    <a href="Index.html">Inicio</a>
                    <a href="Paginas/VerSalones.html" >Salones</a>
                    <a href="#">Contacto</a>
                    <a href="#" class="login-btn">Iniciar sesión</a>
                </div>
        </nav>
        <header class="titulo">
            <h1>Mi Salon Online </h1>
            <p>Nuestra empresa se encarga de gestionar y administrar distintos salones de eventos, con sus catering, fotografos, cocineros, y las disponivilidad de cada uno.</p>
        </div>
        </header>

        <!-- Carousel de imágenes que cambia automáticamente -->
        <div id="miCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="4000">

        <!-- Imágenes -->
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="Imagenes/salon  roma.jpg" class="d-block w-100" alt="Imagen 1">
            </div>
            <div class="carousel-item">
                <img src="Imagenes/Salon major.jpg" class="d-block w-100" alt="Imagen 2">
            </div>
            <div class="carousel-item">
                <img src="Imagenes/salon nicanor.jpg" class="d-block w-100" alt="Imagen 3">
            </div>
            <div class="carousel-item">
                <img src="Imagenes/Salon-Cordoba.jpg" class="d-block w-100" alt="Imagen 4">
            </div>
            <div class="carousel-item">
                <img src="Imagenes/salone madero.jpg" class="d-block w-100" alt="Imagen 5">
            </div>
         </div>

        <!-- Flechas de navegación - opcional -->
        <button class="carousel-control-prev" type="button" data-bs-target="#miCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#miCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
        </button>
    </div>
        <script src="/JS/VerSalonesjs.js "defer></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
